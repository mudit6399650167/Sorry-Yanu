<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorry Yanuu 💖</title>

<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd1dc, #fff0f5);
    font-family: 'Poppins', 'Comic Sans MS', cursive;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 30px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    max-width: 90%;
  }

  h1 {
    color: #ff4d88;
    margin-bottom: 10px;
  }

  p {
    color: #666;
    margin-bottom: 25px;
    font-size: 16px;
  }

  button {
    padding: 12px 26px;
    font-size: 16px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    margin: 10px;
  }

  #yes {
    background: #ff4d88;
    color: white;
  }

  #no {
    background: #e0e0e0;
    position: absolute;
  }

  .heart {
    position: fixed;
    font-size: 20px;
    animation: float 4s linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="card">
  <h1>I'm really sorry, yanuu 🥺💗</h1>
  <p>Please maaf kar do na… pookie 😭</p>

  <button id="yes" onclick="yesClick()">Okay 😭</button>
  <button id="no">Still angry 😒</button>
</div>

<script>
  const noBtn = document.getElementById("no");

  function moveNo() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseenter", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  function yesClick() {
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ffd1dc,#fff0f5);
        font-family:'Comic Sans MS', cursive;
        text-align:center;
      ">
        <h1 style="color:#ff4d88;">Maaf kar diya 😭💖</h1>
        <p style="font-size:18px;color:#555;">
          you are so cute yanaaa<br>
           pretty, beautiful cuite😭💕
        </p>
      </div>
    `;

    for (let i = 0; i < 30; i++) {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "0";
      heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
      document.body.appendChild(heart);
    }
  }
</script>

</body>
</html>
